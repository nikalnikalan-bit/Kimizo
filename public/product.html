<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Product – Kimizo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Zen+Antique&family=DM+Sans:wght@400;500;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Zen+Antique&family=DM+Sans:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/favicon.ico?v=2" sizes="48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=2">
<link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#FFD23F">
</head>
<body>
<header>
  <a href="/" class="logo logo-img" aria-label="kimizo home"><img src="/logo.png" alt="kimizo" width="146" height="36"></a>
  <div class="search"><input id="q" placeholder="Search for unique finds..." aria-label="Search products"><button type="button" id="sb">Search</button></div>
  <div id="auth"></div>
  <button class="cartbtn" id="cb" aria-label="Open cart">🛒<b id="cc">0</b></button>
</header>

<div class="crumbs" id="crumbs" role="navigation" aria-label="Breadcrumb"></div>
<main id="pdb"><p class="pd-msg">Loading product…</p></main>
<div id="rel"></div>

<footer><span class="logo" style="color:#fff">kimizo.in</span><br>Global finds. Closer to you. · Discover a bigger world at Kimizo<div class="copy">© 2026 KIMIZO. ALL RIGHTS RESERVED.</div></footer>

<div class="veil" id="veil"></div>
<aside class="drawer" id="dr" aria-label="Cart">
  <header><b>Your cart</b><button class="cartbtn" id="cx" aria-label="Close cart">✕</button></header>
  <div class="items" id="items"></div>
  <div class="foot"><small id="ship" style="display:block;color:var(--mute);margin-bottom:6px"></small><div class="t"><span>Total</span><span id="tot">₹0</span></div><button id="co">Checkout</button></div>
</aside>
<div class="toast" id="toast"></div>

<!-- app.js gives this page the cart, login links and store settings; product.js draws the product -->
<script src="/app.js"></script>
<script src="/product.js"></script>
</body>
</html>
